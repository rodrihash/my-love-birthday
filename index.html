<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para mi Osita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F5EFE6; --ink:#1E2A6E; --pink:#D9578F; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:'Caveat', cursive; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; min-height:100vh; }
  #stage { position:relative; width:min(100%, 82vh, 760px); aspect-ratio:1; }
  canvas { width:100%; height:100%; display:block; border-radius:8px; box-shadow:0 2px 24px rgba(30,42,110,.14); }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center;
             background:rgba(245,239,230,.72); border-radius:8px; cursor:pointer; }
  #overlay h1 { margin:0; font-size:clamp(34px,7vw,58px); font-weight:700; }
  #overlay span { font-size:clamp(22px,4.5vw,32px); color:var(--pink); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; width:min(100%,760px); }
  button { font-family:inherit; font-size:22px; color:var(--ink); background:transparent; border:2px solid var(--ink);
           border-radius:999px; padding:4px 18px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=range] { flex:1 1 200px; accent-color:var(--pink); }
  #status { font-size:20px; min-height:1.3em; text-align:center; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1080"></canvas>
  <div id="overlay"><h1>Para ti, Osita</h1><span>▶ toca para abrir</span></div>
</div>
<div class="controls">
  <button id="play">reproducir</button>
  <input id="scrub" type="range" min="0" max="70" step="0.01" value="0" aria-label="tiempo">
  <button id="export">descargar video</button>
</div>
<div id="status"></div>

<script>
// ============================================================
//  Configuración
// ============================================================
const W = 1080, DUR = 70, FPS = 30, GY = 800;          // lienzo lógico, duración (s), fps del MP4, línea de suelo
const TAU = Math.PI * 2;
const C = {
  paper:'#F5EFE6', ink:'#1E2A6E',
  yellow:'#F4B63A', orange:'#EE7B2C', honey:'#E7A44C', red:'#E03C31',
  fawn:'#D9A36B', muzzle:'#EACBA3', beard:'#E6E0D7',
  pink:'#F08BB0', pinkDeep:'#D9578F', blush:'#F29AA6',
  green:'#5BAA4A', teal:'#2E8F8A', blue:'#5B8BD0', lime:'#C9D84A',
  brown:'#8A5A3B', tan:'#C99466', gray:'#9C958D', bunny:'#D3CABE',
  charcoal:'#2B2926', smoke:'#5A554F', white:'#FFFFFF',
};
// Subtítulo tipo "reloj" (como "230 million years ago" del original)
const CAPS = [
  [64.5, 'feliz cumpleaños, mi amor'],
];

// ============================================================
//  Utilidades
// ============================================================
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashS(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const easeOut=u=>1-Math.pow(1-u,3);
const back=u=>{ if(u<=0) return 0; const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2); };

let ctx, BOIL=0, SC=0, curS=1;
// Cada primitiva toma su propio PRNG: mismo cuadro -> mismo temblor; cambia 10 veces/s ("line boil")
function nextR(){ return mulberry32((++SC)*374761393 + BOIL*668265263); }

function ellP(cx,cy,rx,ry,rot=0,a0=0,a1=TAU,n){
  n = n || Math.max(12, Math.ceil((rx+ry)*Math.abs(a1-a0)/12));
  const c=Math.cos(rot), s=Math.sin(rot), out=[];
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n, x=Math.cos(a)*rx, y=Math.sin(a)*ry; out.push([cx+x*c-y*s, cy+x*s+y*c]); }
  return out;
}
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function spl(P,seg=10){
  const out=[];
  for(let i=0;i<P.length-1;i++){
    const p0=P[Math.max(0,i-1)], p1=P[i], p2=P[i+1], p3=P[Math.min(P.length-1,i+2)];
    for(let j=0;j<seg;j++){
      const u=j/seg, u2=u*u, u3=u2*u;
      out.push([0,1].map(k=>0.5*((2*p1[k])+(-p0[k]+p2[k])*u+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u3)));
    }
  }
  out.push(P[P.length-1]);
  return out;
}
function resample(pts,closed,step){
  const out=[], n=pts.length, segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const a=pts[i], b=pts[(i+1)%n], d=Math.hypot(b[0]-a[0],b[1]-a[1]), k=Math.max(1,Math.ceil(d/step));
    for(let j=0;j<k;j++){ const u=j/k; out.push([a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]); }
  }
  out.push(closed ? out[0].slice() : pts[n-1].slice());
  return out;
}
// ruido suave a lo largo del trazo
function wobble(pts,amp,r){
  const K=5, n=pts.length, knots=[];
  for(let i=0;i<=Math.ceil(n/K)+2;i++) knots.push([(r()-.5)*2*amp,(r()-.5)*2*amp]);
  return pts.map((p,i)=>{ const f=i/K, i0=Math.floor(f), u=f-i0, s=u*u*(3-2*u), a=knots[i0], b=knots[i0+1];
    return [p[0]+a[0]+(b[0]-a[0])*s, p[1]+a[1]+(b[1]-a[1])*s]; });
}
function path(p){ ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); }

// ------------------------------------------------------------
//  Texturas de crayón / carboncillo (se generan una sola vez)
// ------------------------------------------------------------
const TEXC={};
function makeTex(color,{n=1900,ang=-0.55,len=[16,46],w=[2,4.5],a=[.32,.7],grain=.22}={}){
  const S=256, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d'), r=mulberry32(hashS(color)+n);
  g.strokeStyle=color; g.lineCap='round';
  for(let i=0;i<n;i++){
    const x=r()*S, y=r()*S, L=len[0]+r()*(len[1]-len[0]), an=ang+(r()-.5)*.35, ex=Math.cos(an)*L, ey=Math.sin(an)*L;
    g.globalAlpha=a[0]+r()*(a[1]-a[0]); g.lineWidth=w[0]+r()*(w[1]-w[0]);
    for(const ox of [-S,0,S]) for(const oy of [-S,0,S]){ g.beginPath(); g.moveTo(x+ox,y+oy); g.lineTo(x+ox+ex,y+oy+ey); g.stroke(); }
  }
  const im=g.getImageData(0,0,S,S), d=im.data;
  for(let i=3;i<d.length;i+=4){ d[i] = r()<grain ? d[i]*0.15 : d[i]*(0.75+0.35*r()); }   // grano del papel
  g.putImageData(im,0,0);
  return c;
}
function TEX(color){
  if(!TEXC[color]){
    const dark = color===C.charcoal||color===C.smoke;
    TEXC[color] = makeTex(color, dark ? {n:2600,ang:-0.3,len:[6,22],w:[1,3],a:[.2,.6],grain:.35} : {});
  }
  return TEXC[color];
}
function PAT(color){
  const cache = ctx.__pat || (ctx.__pat={});
  return cache[color] || (cache[color]=ctx.createPattern(TEX(color),'repeat'));
}
let GRAIN_TEX=null;
function grain(){
  if(!GRAIN_TEX){
    const S=256, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
    const im=g.createImageData(S,S), d=im.data, r=mulberry32(99);
    for(let i=0;i<d.length;i+=4){ d[i]=110; d[i+1]=90; d[i+2]=70; d[i+3]= r()<.08 ? 8+r()*22 : 0; }
    g.putImageData(im,0,0); GRAIN_TEX=c;
  }
  const cache = ctx.__pat || (ctx.__pat={});
  const p = cache.grain || (cache.grain=ctx.createPattern(GRAIN_TEX,'repeat'));
  ctx.save(); ctx.fillStyle=p; ctx.fillRect(0,0,W,W); ctx.restore();
}

// ------------------------------------------------------------
//  Primitivas de dibujo
// ------------------------------------------------------------
function ink(pts,o={}){
  if(!pts||pts.length<2) return;
  const rv=o.reveal??1; if(rv<=0) return;
  const r=nextR(), s=curS;
  let p=wobble(resample(pts,!!o.closed,8/s),(o.amp??1.8)/s,r);
  if(rv<1) p=p.slice(0,Math.max(2,Math.ceil(p.length*rv)));
  ctx.save(); ctx.strokeStyle=o.color||C.ink; ctx.lineCap=ctx.lineJoin='round'; ctx.globalAlpha*=o.alpha??1;
  const w=(o.w??3.2)/s, step=5;
  for(let i=0;i<p.length-1;i+=step){
    ctx.beginPath(); ctx.lineWidth=w*(0.7+r()*0.6); ctx.moveTo(p[i][0],p[i][1]);
    for(let j=i+1;j<=Math.min(i+step,p.length-1);j++) ctx.lineTo(p[j][0],p[j][1]);
    ctx.stroke();
  }
  ctx.restore();
}
function crayon(pts,color,o={}){
  if(!pts||pts.length<3) return;
  const r=nextR();
  const p=wobble(resample(pts,true,14/curS),(o.spill??4)/curS,r);
  const dx=(r()-.5)*6/curS, dy=(r()-.5)*6/curS;
  ctx.save(); ctx.globalAlpha*=o.alpha??0.92;
  if(o.solid) ctx.fillStyle=color;
  else { const pat=PAT(color); pat.setTransform(new DOMMatrix([1,0,0,1,r()*256,r()*256])); ctx.fillStyle=pat; }
  ctx.translate(dx,dy); path(p); ctx.closePath(); ctx.fill();
  if(o.dense) ctx.fill();
  ctx.restore();
}
function crayonStroke(pts,color,w,o={}){
  if(!pts||pts.length<2) return;
  const r=nextR();
  let p=wobble(resample(pts,false,10/curS),(o.amp??2)/curS,r);
  if(o.reveal!==undefined){ if(o.reveal<=0) return; p=p.slice(0,Math.max(2,Math.ceil(p.length*o.reveal))); }
  ctx.save(); ctx.globalAlpha*=o.alpha??0.95;
  const pat=PAT(color); pat.setTransform(new DOMMatrix([1,0,0,1,r()*256,r()*256]));
  ctx.strokeStyle=pat; ctx.lineWidth=w; ctx.lineCap=ctx.lineJoin='round';
  path(p); ctx.stroke();
  ctx.restore();
}
function shape(pts,fill,o={}){ if(fill) crayon(pts,fill,o); if(!o.noInk) ink(pts,{closed:true,...(o.ink||{})}); return pts; }
function blob(cx,cy,rx,ry,fill,o={}){ return shape(ellP(cx,cy,rx,ry,o.rot||0),fill,o); }
function dot(cx,cy,rx,ry,color=C.ink){
  const r=nextR(), p=wobble(resample(ellP(cx,cy,rx,ry),true,4/curS),0.7/curS,r);
  ctx.save(); ctx.fillStyle=color; path(p); ctx.fill(); ctx.restore();
}
function eye(x,y,r,o={}){
  if(o.closed){ ink(spl([[x-r,y-1],[x,y+r*.55],[x+r,y-1]],6),{w:3}); return; }
  const lx=(o.lx||0)*r*.28, ly=(o.ly||0)*r*.28;
  dot(x+lx,y+ly,r,r*1.05);
  dot(x+lx+r*.35,y+ly-r*.38,r*.32,r*.32,C.white);
}
function at(x,y,s,rot,fn,flip=1){
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot); ctx.scale(s*flip,s);
  const p=curS; curS*=s; fn(); curS=p; ctx.restore();
}
function hand(str,x,y,size,o={}){
  const r=nextR();
  ctx.save();
  ctx.font=`${o.weight||500} ${size}px Caveat, "Bradley Hand", cursive`;
  ctx.textBaseline='alphabetic'; ctx.fillStyle=o.color||C.ink; ctx.globalAlpha*=o.alpha??1;
  ctx.translate(x+(r()-.5)*1.6, y+(r()-.5)*1.6); ctx.rotate((o.rot||0)+(r()-.5)*0.012);
  const rv=o.reveal??1;
  const full=ctx.measureText(str).width;
  if(o.maxW && full>o.maxW) ctx.scale(o.maxW/full,o.maxW/full);
  ctx.textAlign='left';
  ctx.fillText(rv<1 ? str.slice(0,Math.floor(str.length*clamp(rv))) : str, -full/2, 0);
  ctx.restore();
  return full;
}

// ------------------------------------------------------------
//  Elementos del escenario
// ------------------------------------------------------------
function heartP(cx,cy,s){ const p=[]; for(let i=0;i<=40;i++){ const a=i/40*TAU, x=16*Math.pow(Math.sin(a),3), y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)); p.push([cx+x*s/16, cy+y*s/16]); } return p; }
function heart(x,y,s,col=C.pink,a=1){ if(a<=0) return; ctx.save(); ctx.globalAlpha*=a; shape(heartP(x,y,s),col,{ink:{w:2.6}}); ctx.restore(); }

function sun(x,y,r=58,o={}){
  const rv=o.reveal??1; if(rv<=0) return;
  const sp=[], turns=3;
  for(let a=0;a<=TAU*turns;a+=0.2){ const rr=r*.92*(a/(TAU*turns)); sp.push([x+Math.cos(a)*rr, y+Math.sin(a)*rr]); }
  crayonStroke(sp,C.yellow,15,{reveal:rv});
  crayon(ellP(x,y,r*.35,r*.35),C.orange,{alpha:.55*rv});
  ink(ellP(x,y,r,r),{closed:true,reveal:rv});
  if(rv>=1 && o.rays!==false) for(let i=0;i<10;i++){
    const a=i/10*TAU+.15, r1=r+14, r2=r+32-(i%2?6:0);
    ink([[x+Math.cos(a)*r1,y+Math.sin(a)*r1],[x+Math.cos(a)*r2,y+Math.sin(a)*r2]],{w:2.8});
  }
}
function ground(rv=1){ ink([[-20,GY],[1100,GY]],{reveal:rv,w:3.4}); }
function tuft(x,y,s=1){
  at(x,y,s,0,()=>{
    for(const [ex,ey] of [[-12,-30],[-4,-42],[6,-36],[14,-26]]){
      const c=spl([[ex*.2,0],[ex*.6,ey*.5],[ex,ey]],5);
      crayonStroke(c,C.green,5,{alpha:.8}); ink(c,{w:2.4});
    }
  });
}
function flower(x,y,s=1,col=C.pink,stem=40){
  at(x,y,s,0,()=>{
    if(stem){ crayonStroke([[0,0],[0,-stem]],C.green,5); ink(spl([[0,0],[2,-stem*.5],[0,-stem]],6),{w:2.4}); }
    const cy=-stem-8;
    for(let i=0;i<5;i++){ const a=i/5*TAU-Math.PI/2; blob(Math.cos(a)*10,cy+Math.sin(a)*10,8,8,col,{ink:{w:2}}); }
    blob(0,cy,6,6,C.yellow,{ink:{w:2}});
  });
}
function frond(x,y,len,ang,s=1,rv=1){
  if(rv<=0) return;
  at(x,y,s,ang,()=>{
    ink(spl([[0,0],[4,-len*.5],[0,-len]],8),{w:2.6,reveal:rv});
    const n=9;
    for(let i=1;i<=n;i++){
      const u=i/n; if(u>rv) break;
      const py=-len*u*.95, px=Math.sin(u*2)*3, L=(1-u*.75)*len*.28;
      for(const sd of [-1,1]){
        const lp=ellP(px+sd*L*.55,py+L*.15,L*.55,L*.18,sd*-0.45);
        crayon(lp,C.green,{alpha:.85,spill:2});
        if(i%2) ink(lp,{closed:true,w:2});
      }
    }
  });
}
function clinic(x){
  const L=x-95, R=x+95, T=GY-230;
  crayon(rect(L,T,190,230),C.yellow,{alpha:.3});
  ink(rect(L,T,190,230),{closed:true});
  shape([[L-22,T+4],[x,T-92],[R+22,T+4]],C.teal);
  shape(rect(x-26,GY-84,52,84),C.brown);
  dot(x+14,GY-42,3,3);
  shape(rect(L+16,T+104,40,36),C.blue,{alpha:.45});
  shape(rect(R-56,T+104,40,36),C.blue,{alpha:.45});
  blob(x,T+56,32,32,C.white,{alpha:.6});
  // huellita rosa
  dot(x,T+64,10,8,C.pinkDeep);
  for(const [dx,dy] of [[-13,-6],[-5,-15],[5,-15],[13,-6]]) dot(x+dx,T+56+dy,4,4.5,C.pinkDeep);
}
function tennisBall(x,y,r){
  blob(x,y,r,r,C.lime,{dense:true});
  ink(ellP(x-r*1.15,y,r*.7,r*.9,0,-1,1),{w:2.6});
  ink(ellP(x+r*1.15,y,r*.7,r*.9,0,Math.PI-1,Math.PI+1),{w:2.6});
}
function butterfly(t,col=C.pink){
  const fl=Math.max(.18,Math.abs(Math.cos(t*14)));
  ctx.save(); ctx.scale(fl,1);
  shape(ellP(-14,-8,14,11,-.5),col); shape(ellP(14,-8,14,11,.5),col);
  shape(ellP(-10,8,9,7,.4),col); shape(ellP(10,8,9,7,-.4),col);
  ctx.restore();
  ink([[0,-14],[0,14]],{w:3});
  ink(spl([[0,-14],[-5,-24],[-9,-28]],4),{w:2}); ink(spl([[0,-14],[5,-24],[9,-28]],4),{w:2});
}

// ------------------------------------------------------------
//  Personajes (origen = entre los pies, sobre el suelo)
// ------------------------------------------------------------
function arm(sx,sy,ang,fur){
  blob(sx-Math.sin(ang)*22, sy+Math.cos(ang)*22, 14, 28, fur, {rot:ang});
  return [sx-Math.sin(ang)*46, sy+Math.cos(ang)*46];
}
function bow(x,y){
  shape([[x,y],[x-26,y-17],[x-23,y+15]],C.pink,{dense:true});
  shape([[x,y],[x+26,y-17],[x+23,y+15]],C.pink,{dense:true});
  blob(x,y,6,6,C.pinkDeep,{dense:true});
}
function bear(o={}){
  const t=o.t??0, fur=o.fur||C.honey, bel=o.belly||C.yellow, ph=t*11;
  const bob = o.walk ? -Math.abs(Math.sin(ph))*7 : o.bounce ? -Math.abs(Math.sin(t*8))*14 : Math.sin(t*2.2)*1.5;
  if(!o.sit){ const sw=o.walk?Math.sin(ph)*9:0; blob(-24+sw,-13,20,14,fur); blob(24-sw,-13,20,14,fur); }
  ctx.save(); ctx.translate(0,bob+(o.sit?12:0));
  blob(0,-72,54,58,fur);
  crayon(ellP(0,-64,30,33),bel,{alpha:.85});
  const hL=arm(-40,-100,o.aL??0.45,fur);
  const hnd=arm(40,-100,-(o.aR??0.45),fur);
  if(o.flower) flower(hnd[0],hnd[1]+6,.9,C.pink,34);
  if(o.steth){
    ink(spl([[-30,-114],[-34,-92],[-18,-72],[0,-62]],6),{w:3});
    ink(spl([[30,-114],[34,-92],[18,-72],[0,-62]],6),{w:3});
    ink([[0,-62],[0,-46]],{w:3}); blob(0,-38,9,9,C.teal);
  }
  if(o.scarf){ const sc=spl([[-40,-118],[0,-104],[40,-118]],6); crayonStroke(sc,C.teal,16); ink(sc,{w:2.6}); shape(rect(14,-112,14,32),C.teal); }
  // cabeza
  ctx.save(); ctx.translate(0,-160); ctx.rotate(o.tilt||0);
  for(const sx of [-1,1]){ blob(sx*42,-42,19,18,fur); crayon(ellP(sx*42,-41,9,8),C.pink,{alpha:.75}); }
  blob(0,0,58,51,fur);
  blob(0,19,22,15,bel);
  dot(0,10,7.5,5.5);
  ink([[0,15],[0,21]],{w:2.6});
  if(o.mouthO) ink(ellP(0,28,5,6.5),{closed:true,w:2.6}); else ink(spl([[-9,22],[-4,27],[0,22],[4,27],[9,22]],4),{w:2.6});
  const lx=o.look||0, ly=o.ly||0;
  eye(-22,-6,10.5,{lx,ly,closed:o.blink}); eye(22,-6,10.5,{lx,ly,closed:o.blink});
  const bl=o.blush??.7;
  crayon(ellP(-38,16,11*(.8+bl*.3),7),C.blush,{alpha:clamp(bl)}); crayon(ellP(38,16,11*(.8+bl*.3),7),C.blush,{alpha:clamp(bl)});
  if(o.glasses){ ink(ellP(-22,-6,17,16),{closed:true,w:2.6}); ink(ellP(22,-6,17,16),{closed:true,w:2.6}); ink([[-5,-8],[5,-8]],{w:2.6}); }
  if(o.sweat) shape(spl([[50,-46],[58,-30],[50,-22],[42,-30],[50,-46]],5),C.blue,{alpha:.8,ink:{w:2}});
  if(o.bow) bow(-36,-50);
  ctx.restore();
  if(o.holdL) o.holdL(hL);
  if(o.holdR) o.holdR(hnd);
  ctx.restore();
  if(o.sit){
    for(const sx of [-1,1]){ blob(sx*30,-16,20,17,fur); crayon(ellP(sx*30,-14,9,8),C.pink,{alpha:.8}); }
  }
}
function dog(o={}){

function keys(t,K){
  const get=k=>({x:k[1],y:k[2],z:k[3],r:k[4]||0});
  if(t<=K[0][0]) return get(K[0]);
  for(let i=0;i<K.length-1;i++){
    const a=K[i], b=K[i+1];
    if(t<=b[0]){ const u=ease((t-a[0])/Math.max(1e-6,b[0]-a[0])); return {x:lerp(a[1],b[1],u), y:lerp(a[2],b[2],u), z:lerp(a[3],b[3],u), r:lerp(a[4]||0,b[4]||0,u)}; }
  }
  return get(K[K.length-1]);
}

}

// La oficina de él
function office(t,st){
  const ev=!!st.ev, dusk=ev?1:(st.dusk||0), up=ev?1:(st.up||0);
  floorLine();
  const WL=600, WT=100, WW=220, WH=190;
  crayon(rect(WL,WT,WW,WH),C.blue,{alpha:.35*(1-dusk)});
  if(dusk>0){ crayon(rect(WL,WT,WW,WH*.5),C.pink,{alpha:.55*dusk}); crayon(rect(WL,WT+WH*.45,WW,WH*.55),C.orange,{alpha:.55*dusk}); }
  ink(rect(WL,WT,WW,WH),{closed:true}); ink([[WL+WW/2,WT],[WL+WW/2,WT+WH]],{w:2.6});
  clock(250,250,48,st.hA,st.mA);
  plant(110,GY);
  serverRack(960,t,st.alarm);
  at(470,GY-80,.9,0,()=>bear({t,fur:C.brown,belly:C.tan,glasses:1,scarf:1,
    look: up>0?.9:.9, ly: up>0?.2:0, blush:.55+.6*up, sweat:st.alarm&&t>1.9, mouthO:st.alarm,
    blink:st.relief, tilt:st.relief?.14:0,
    aR: lerp(.45,1.8,up), holdR: up>0 ? h=>phone(h[0]+8,h[1]-42,true,t) : null}));
  desk();
  shape(rect(400,GY-192,150,16),C.gray,{ink:{w:2.2}});
  if(st.typing) for(let i=0;i<2;i++) blob(440+i*70,GY-198-Math.abs(Math.sin(t*26+i*1.7))*12,16,12,C.brown);
  monitor(680,GY-175,t,st);
  mug(330,GY-175,t,true);
  if(ev||t>3.6) mug(285,GY-175,t,false);
  if(ev||t>4.8) mug(240,GY-175,t,false);
  if(st.alarm) [[540,GY-440],[840,GY-430],[700,GY-470]].forEach(([x,y],i)=>{ if((Math.floor(t*4)+i)%2) hand('!',x,y,72,{weight:700,color:C.red}); });
  if(st.relief) hand('uff...',330,GY-300,44,{weight:700,alpha:.9});
  if(!ev && up<=0){ phone(400,GY-221,st.lit,t); if(st.lit) hand('bzz',440,GY-270,34,{alpha:Math.floor(t*8)%2?1:.4,weight:700}); }
  if(!ev) risingHearts(t,10.5,4,480,GY-290,40,.3,1.3,110);
}

function clinicIn(t,ev){
  floorLine();

  shape([[170,GY-260],[212,GY-240],[212,GY-12],[170,GY]],C.teal,{dense:true});

  const ff=ev?1:prog(t,20.4,21.2);

  if(ff>0){ crayon(rect(700,140,180,75),C.pink,{alpha:.55*ff}); crayon(rect(700,210,180,80),C.orange,{alpha:.55*ff}); }
  ink(rect(700,140,180,150),{closed:true}); ink([[790,140],[790,290]],{w:2.6});
  clock(300,230,46, ev?Math.PI/2:-Math.PI/2+.9+ff*1.6, ev?-Math.PI/2:-Math.PI/2+t*.8+ff*TAU*8);
  pawSign(510,220);

  cage(660,GY-330,{inside:()=>at(650,GY-182,.55,0,()=>cat({t,col:C.gray}))});
  cage(840,GY-330,{inside:()=>{ ink([[790,GY-212],[890,GY-212]],{w:2.4}); at(840,GY-230,.6,0,()=>parakeet({t,col:C.green,sing:react})); }});
  cage(1020,GY-330,{inside:()=>at(1000,GY-182,.55,0,()=>rabbit({t,hop:react}))});
  cage(660,GY-165,{inside:()=>at(650,GY-17,.5,0,()=>dog({t,col:C.yellow,patch:C.brown,jump:react}))});
  cage(840,GY-165, ev ? {inside:()=>at(840,GY-17,.5,0,()=>dog({t,col:C.orange,sleep:1}))} : {open:true});
  cage(1020,GY-165,{inside:()=>at(1000,GY-17,.5,0,()=>cat({t,col:C.orange,stripe:C.brown,sleep:1}))});

  if(react){ hand('¡pío!',900,GY-300,34,{weight:700}); hand('¡guau!',700,GY-190,30,{weight:700}); }

  if(ev){ // ya todo en orden: se despide con el celular en la mano
    at(380,GY,.85,0,()=>bear({t,bow:1,steth:1,look:.3,blush:1.1,aL:2.4+Math.sin(t*9)*.35,aR:1.8,holdR:h=>phone(h[0]+8,h[1]-42,true,t)}));

  // el desastre
  for(const [x,y,a,col] of MESS) crayonStroke([[x-Math.cos(a)*9,y-Math.sin(a)*5],[x+Math.cos(a)*9,y+Math.sin(a)*5]],col,8);

  shape(ellP(800,GY,34,22,0,Math.PI,TAU),C.teal);
  for(const [x,y] of [[770,GY+10],[836,GY+6],[850,GY+16],[760,GY-4]]) dot(x,y,4,3.5,C.brown);
  at(960,GY-24,1,-Math.PI/2+.15,()=>shape([[-22,-30],[22,-30],[16,30],[-16,30]],C.gray,{dense:true}));
  for(const [x,y,sc] of [[650,GY-10,.8],[1010,GY-12,1],[1070,GY-8,.9],[900,GY-6,.7]]) stuffing(x,y,sc);
  for(const [x,y] of PRINTS) pawPrint(x,y,.9);

  // ella entra con su café
  const walkU=prog(t,12,13.6), hx=lerp(-60,380,walkU);
  const shock=t>=13.6&&t<17.8, hug=t>=18.9&&t<19.5, sit=t>=19.5;
  const up=ease(prog(t,21.8,22.3));
  const hasCup=t<13.7;
  at(hx,GY,.85,0,()=>bear({t,bow:1,steth:1,walk:walkU<1,sit,
    look:.8, ly:sit&&up<=0?.4:0, mouthO:shock&&t<17.2, sweat:shock,
    blink:sit&&t>19.8&&t<21.3, tilt:sit&&t<21.3?.12:0,
    blush:hug||sit?1:.6, bounce:t>22.6,
    aL: shock?-2.6:hug?-1.4:.45,
    aR: hasCup?.8:shock?-2.6:hug?-1.4:lerp(.45,1.8,up),
    holdR: hasCup ? h=>{ shape(rect(h[0]-10,h[1]-28,20,28),C.white,{ink:{w:2}}); crayon(rect(h[0]-10,h[1]-20,20,8),C.brown,{alpha:.7}); }

    at(440+u*14,lerp(GY-95,GY-12,u*u),1,u*1.9,()=>shape(rect(-10,-14,20,28),C.white,{ink:{w:2}}));
  }

  let dx=1190, dy=GY, ds='idle';
  if(t>=18.05&&t<18.6){ dx=lerp(1190,500,prog(t,18.05,18.6)); ds='run'; }
  else if(t>=18.6&&t<18.95){ const u=prog(t,18.6,18.95); dx=lerp(500,410,u); dy=GY-Math.sin(u*Math.PI)*120-u*110; ds='jump'; }
  else if(t>=18.95) ds='held';
  if(ds!=='held'){
    at(dx,dy,.75,0,()=>dog({t,col:C.orange,tongue:ds!=='idle',run:ds==='run'}),-1);
    if(ds==='idle') stuffing(dx-60,dy-64,.8);
  } else if(!sit) at(hx+10,GY-92,.45,0,()=>dog({t,col:C.orange,tongue:1}),-1);
  else at(hx+4,GY-38,.45,0,()=>dog({t,col:C.orange,sleep:t>19.9,tongue:t<=19.9}),-1);
  risingHearts(t,18.95,4,hx+10,GY-230,30,.2,1.1,90);
  if(t>19.8&&t<20.4) hand('uff...',hx-150,GY-130,44,{weight:700,alpha:prog(t,19.8,20)});
  if(t>=21.3&&up<=0){ phone(hx+100,GY-26,true,t); hand('bzz',hx+130,GY-80,34,{weight:700,alpha:Math.floor(t*8)%2?1:.4}); }
  risingHearts(t,22.6,4,hx,GY-230,30,.3,1.3,100);

// 40–45 s: construir legos (la cámara sube con la torre)
const BRICKS=[C.red,C.yellow,C.teal,C.blue,C.green,C.orange,C.red,C.yellow];
function sLego(t){
  let placed=0; for(let i=0;i<8;i++) placed+=prog(t,40.3+i*.42,40.6+i*.42);
  const topY=GY-44*placed, zo=ease(prog(t,43.9,44.8));
  applyCam({x:540,y:lerp(clamp(topY+90,GY-420,GY-190),520,zo),z:lerp(1.3,.95,zo)});
  floorLine();
  crayon(ellP(540,GY+30,380,40),C.pink,{alpha:.35});
  shape(rect(90,GY-70,120,70),C.yellow);
  for(const [x,col] of [[235,C.red],[880,C.teal],[940,C.blue]]) brick(x,GY-30,col,50);
  for(let i=0;i<8;i++){
    const st=40.3+i*.42, u=prog(t,st,st+.3); if(u<=0) continue;
    const top=GY-44*(i+1);
    brick(540+(i%2?6:-6),lerp(top-320,top,u*u),BRICKS[i]);
  }
  const hp=back(prog(t,43.8,44.3)); if(hp>0) heart(540,GY-44*8-46,34*hp,C.pink);
  const cheer=t>44.2;
  const act=p=>{ for(let i=p;i<8;i+=2){ const st=40.3+i*.42; if(t>st-.3&&t<st+.25) return true; } return false; };
  at(300,GY,.85,0,()=>bear({t,fur:C.brown,belly:C.tan,glasses:1,look:.8,ly:-.6,bounce:cheer,aR:cheer?2.4:act(0)?1.9:.45,aL:cheer?2.4:.45}));
  at(780,GY,.85,0,()=>bear({t,bow:1,look:.8,ly:-.6,bounce:cheer,blush:.9,aR:cheer?2.4:act(1)?1.9:.45,aL:cheer?2.4:.45}),-1);
  risingHearts(t,44.3,4,540,GY-440,90,.2,1.2,120);
}
// 45–50.5 s: compras navideñas (la cámara los sigue por la calle)
function sShop(t){
  const cx=lerp(430,1520,prog(t,45,50.5));
  ctx.save();
  applyCam({x:cx,y:GY-270,z:1.1},540,560);
  ink([[-600,GY],[2600,GY]],{w:3.4}); ink([[-600,GY+40],[2600,GY+40]],{w:2,alpha:.5});
  shop(250,'regalos',C.red); lamp(620); xmasTree(1010,GY,1.1,t); lamp(1330); shop(1700,'navidad',C.green); lamp(2080);
  const himX=cx-170, herX=cx+70;
  at(himX,GY,.8,0,()=>bear({t,fur:C.brown,belly:C.tan,glasses:1,walk:true,look:.8,aL:1.2,aR:1.2}));
  at(himX+30,GY-95,.8,Math.sin(t*6)*.05,()=>{
    shape(rect(-10,-40,70,40),C.teal); crayonStroke([[25,-40],[25,0]],C.pink,6);
    shape(rect(0,-80,54,40),C.red); crayonStroke([[27,-80],[27,-40]],C.yellow,6);
    shape(rect(6,-110,40,30),C.yellow); crayonStroke([[26,-110],[26,-80]],C.pink,5);
  });
  at(herX,GY,.8,0,()=>bear({t,bow:1,walk:true,look:-.7,blush:.9,aR:.8,
    holdR:h=>{ ink(ellP(h[0],h[1]+8,12,14,0,Math.PI,TAU),{w:2.4}); shape(rect(h[0]-24,h[1]+8,48,54),C.pink,{dense:true}); heart(h[0],h[1]+34,9,C.white); }}));
  ctx.restore(); curS=FS;
  snowScreen(t);
}
// Retratos de sus perritos (busto; origen = barbilla)
function schnauzer(){
  const g=C.gray, lt=C.beard;
  blob(0,24,56,34,g);
  shape(spl([[-42,-100],[42,-100],[48,-44],[30,-8],[-30,-8],[-48,-44],[-42,-100]],5),g);
  shape([[-40,-100],[-72,-78],[-42,-60]],g); shape([[40,-100],[72,-78],[42,-60]],g);
  shape(spl([[-28,-48],[28,-48],[32,-14],[14,10],[0,16],[-14,10],[-32,-14],[-28,-48]],5),lt,{dense:true,ink:{w:2.2}});
  for(const sd of [-1,1]) for(let k=0;k<3;k++) ink([[sd*(6+k*7),-36],[sd*(10+k*9),-2+k*3]],{w:1.8,alpha:.6});
  eye(-20,-60,6.5); eye(20,-60,6.5);
  for(const sd of [-1,1]) crayonStroke([[sd*8,-72],[sd*36,-80]],lt,11,{alpha:1});
  dot(0,-44,10,7);
  at(-38,-98,.7,0,()=>bow(0,0));
}
function pitbull(){
  const f=C.fawn;
  blob(0,24,62,36,f);
  crayon(ellP(0,30,22,26),C.white,{dense:true});
  crayonStroke(spl([[-50,-4],[0,6],[50,-4]],4),C.teal,12);
  shape([[-50,-94],[-76,-104],[-64,-70]],f); shape([[50,-94],[76,-104],[64,-70]],f);
  shape(spl([[-54,-98],[54,-98],[64,-50],[44,-12],[-44,-12],[-64,-50],[-54,-98]],5),f);
  crayon(ellP(0,-80,8,14),C.white,{alpha:.7});

  dot(0,-44,12,8);
  ink(spl([[-24,-28],[-11,-20],[0,-26],[11,-20],[24,-28]],4),{w:2.4});

}
function photoFrame(x,y,w,h,bg,fn){
  ink([[x-w/2+10,y-h/2-14],[x,y-h/2-52],[x+w/2-10,y-h/2-14]],{w:2}); dot(x,y-h/2-54,5,5);
  shape(rect(x-w/2-13,y-h/2-13,w+26,h+26),C.brown,{dense:true});
  crayon(rect(x-w/2,y-h/2,w,h),C.paper,{solid:true,spill:0});
  crayon(rect(x-w/2,y-h/2,w,h),bg,{alpha:.45,spill:0});
  ctx.save(); path(rect(x-w/2,y-h/2,w,h)); ctx.closePath(); ctx.clip();
  at(x,y+h/2-25,.9,0,fn);
  crayonStroke(ellP(x,y+h/2-25-.9*118,26,7),C.yellow,5);
  ctx.restore();
  ink(rect(x-w/2,y-h/2,w,h),{closed:true,w:2.6});
}
function bunting(t){
  const pts=[]; for(let x=-300;x<=1400;x+=60) pts.push([x,130+Math.sin(x*.01)*22]);
  ink(spl(pts,4),{w:2.2});
  pts.forEach(([x,y],i)=>{ const sw=Math.sin(t*2+i)*3; shape([[x-18,y+2],[x+18,y+2],[x+sw,y+42]],[C.pink,C.yellow,C.teal,C.orange][i%4],{dense:true,ink:{w:2}}); });
}
function balloon(x,y,col,t,ph){
  const bx=x+Math.sin(t*1.3+ph)*8, by=y+Math.sin(t*1.7+ph)*6;
  ink(spl([[bx,by+50],[bx-8,by+140],[bx+6,by+240],[x,GY-8]],6),{w:1.8});
  shape([[bx-6,by+44],[bx+6,by+44],[bx,by+54]],col,{ink:{w:1.8}});
  shape(ellP(bx,by,36,44),col,{dense:true});
  crayon(ellP(bx-12,by-16,7,11,-.4),C.white,{alpha:.7});
}
// 56.5–70 s: y aquí seguimos... feliz cumpleaños
function sFinal(t){
  applyCam(keys(t,[[56.5,545,GY-190,2],[58,545,GY-190,2],[60.3,545,370,1.55],[62.5,545,370,1.55],[64.5,540,510,1.08],[70,540,520,1.02]]));
  floorLine();
  crayon(ellP(540,GY+30,420,44),C.pink,{alpha:.35});
  crayon(rect(40,240,200,190),C.ink,{alpha:.5});
  crayon(ellP(190,290,20,20),C.yellow,{dense:true});
  for(const [x,y] of [[80,280],[120,370],[200,390],[90,410]]){ crayonStroke([[x-6,y],[x+6,y]],C.yellow,3); crayonStroke([[x,y-6],[x,y+6]],C.yellow,3); }
  ink(rect(40,240,200,190),{closed:true}); ink([[140,240],[140,430]],{w:2.6}); ink([[40,335],[240,335]],{w:2.6});
  bunting(t);
  photoFrame(390,370,128,146,C.pink,schnauzer);
  photoFrame(700,370,128,146,C.teal,pitbull);
  risingHearts(t,60.6,3,390,270,20,.5,1.6,80);
  risingHearts(t,60.8,3,700,270,20,.5,1.6,80);
  balloon(900,330,C.pink,t,0); balloon(975,280,C.yellow,t,1.3); balloon(1040,350,C.teal,t,2.1);
  shape(rect(820,GY-50,60,50),C.pink,{dense:true}); crayonStroke([[850,GY-50],[850,GY]],C.red,6);
  shape(rect(980,GY-40,50,40),C.teal); crayonStroke([[1005,GY-40],[1005,GY]],C.yellow,6);
  const tilt=.18*ease(prog(t,57,58));
  at(460,GY,.85,0,()=>bear({t,bow:1,sit:1,tilt,look:.6,blush:.9,blink:(t%3.2)<.12}));
  at(625,GY,.98,0,()=>bear({t,fur:C.brown,belly:C.tan,glasses:1,scarf:1,sit:1,tilt:tilt*.7,look:.6,blush:.8,aR:.45+.9*ease(prog(t,57,58))}),-1);
  const pk=back(prog(t,63.2,63.6));
  if(pk>0) at(625,GY-216,.7*pk,0,()=>parakeet({t,col:C.green,sing:t>64}),-1);
  at(545,GY+4,.85,0,()=>{
    ink(ellP(0,0,100,10),{closed:true,w:2.6});
    shape(rect(-80,-52,160,50),C.yellow);
    shape(rect(-60,-94,120,42),C.yellow);
    crayon([[-62,-94],[62,-94],[62,-78],[50,-70],[40,-80],[26,-66],[12,-80],[-4,-68],[-18,-80],[-34,-66],[-48,-80],[-62,-72]],C.pink,{alpha:.95});
    crayon([[-82,-52],[82,-52],[82,-38],[66,-30],[52,-40],[36,-28],[18,-40],[0,-30],[-18,-40],[-36,-28],[-52,-40],[-68,-30],[-82,-38]],C.pink,{alpha:.95});
    for(const [x,y,col] of [[-40,-16,C.teal],[-10,-20,C.orange],[25,-14,C.red],[55,-20,C.teal],[-30,-60,C.orange],[20,-58,C.teal]]) crayonStroke([[x,y],[x+8,y-4]],col,5);
    shape(rect(-6,-142,12,48),C.white);
    for(const y of [-132,-118,-104]) crayonStroke([[-6,y+6],[6,y]],C.pink,4);
    const fl=Math.sin(t*20)*3;
    crayon(ellP(0,-160,26,26),C.yellow,{alpha:.3});
    shape(spl([[0,-176-fl],[8,-160],[0,-148],[-8,-160],[0,-176-fl]],5),C.yellow,{ink:{w:2.2}});
    crayon(ellP(0,-156,3,6),C.orange,{spill:1});
  });
  const a1=back(prog(t,63,63.5)), a2=back(prog(t,63.3,63.8)), a3=back(prog(t,63.6,64.1));
  if(a1>0) at(215,GY,.75*a1,0,()=>dog({t,col:C.orange,tongue:1}));
  if(a2>0) at(760,GY,.7*a2,0,()=>cat({t,col:C.gray}),-1);
  if(a3>0) at(330,GY,.7*a3,0,()=>rabbit({t,hop:t>65&&t<66.5}));
  for(let k=0;k<16;k++){
    const u=prog(t,64.5+k*.32,66.9+k*.32); if(u<=0||u>=1) continue;
    heart(540+Math.sin(k*2.3)*300, GY-300-u*260, 16+(k%4)*4, k%4===2?C.red:C.pink, Math.sin(u*Math.PI));
  }
  if(t>64.5) for(const f of CONFETTI){
    const tt=t-64.5-f.d; if(tt<0) continue;
    const y=-60+tt*f.v; if(y>GY) continue;
    const x=f.x+Math.sin(tt*2+f.a)*20, a=f.a+tt*3;
    crayonStroke([[x-Math.cos(a)*9,y-Math.sin(a)*9],[x+Math.cos(a)*9,y+Math.sin(a)*9]],f.c,6);
  }
}

// [inicio, escena, desfase de tiempo]
const SCENES=[[0,sOffice,0],[12,sClinic,0],[24,sSplit,6],[30,sDrive,6],[36,sFood,6],[41,sPuzzle,6],[46,sLego,6],[51,sShop,6],[56.5,sFinal,0]];
function caption(t){
  for(const [t0,s] of CAPS) if(t>=t0) hand(s,540,985,78,{reveal:prog(t,t0,t0+.9),weight:700,maxW:1000});
}
function drawScene(t){
  let cur=SCENES[0]; for(const sc of SCENES) if(t>=sc[0]) cur=sc;
  // sin subtítulos las escenas se ven más grandes; al final se vuelve al encuadre normal para la frase
  const f=1-ease(prog(t,62.5,64.5));
  FS=1+.15*f; FX.red=0;
  ctx.save(); ctx.translate(540,540+80*f); ctx.scale(FS,FS); ctx.translate(-540,-540); curS=FS;
  cur[1](t-cur[2]);
  ctx.restore(); curS=1;
  if(FX.red>0 && Math.floor(t*4)%2===0){ ctx.save(); ctx.globalAlpha=FX.red; crayonStroke([[0,0],[W,0],[W,W],[0,W],[0,0]],C.red,130); ctx.restore(); }
  for(const [b] of SCENES.slice(1)){ const a=1-Math.abs(t-b)/.2; if(a>0){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,W); ctx.restore(); } }
  caption(t);
  grain();
}
function render(g,t,k){
  ctx=g; ctx.setTransform(k,0,0,k,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  SC=0; BOIL=Math.floor(t*10+1e-6); curS=1;
  ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,W);
  drawScene(t);
}

// ============================================================
//  Reproducción en vivo
// ============================================================
const cv=document.getElementById('cv'), g0=cv.getContext('2d');
const overlay=document.getElementById('overlay'), btnPlay=document.getElementById('play'),
      btnExport=document.getElementById('export'), scrub=document.getElementById('scrub'), statusEl=document.getElementById('status');
let K=1, cur=0, playing=false, tStart=0;
const audio=new Audio('music.mp3'); let audioOk=true; audio.addEventListener('error',()=>{audioOk=false;});   // opcional: pon un music.mp3 junto a este archivo

function fit(){
  const css=cv.getBoundingClientRect().width||720;
  const px=Math.min(2160,Math.round(css*(window.devicePixelRatio||1)));
  if(cv.width!==px){ cv.width=cv.height=px; g0.__pat=null; }
  K=px/W; render(g0,cur,K);
}
function tick(now){
  if(!playing) return;
  cur=(now-tStart)/1000;
  if(cur>=DUR){ cur=DUR; playing=false; btnPlay.textContent='otra vez'; }
  render(g0,cur,K); scrub.value=cur;
  if(playing) requestAnimationFrame(tick);
}
function play(){
  if(cur>=DUR) cur=0;
  playing=true; overlay.style.display='none'; btnPlay.textContent='pausa';
  tStart=performance.now()-cur*1000;
  if(audioOk){ audio.currentTime=cur; audio.play().catch(()=>{}); }
  requestAnimationFrame(tick);
}
function pause(){ playing=false; btnPlay.textContent='reproducir'; audio.pause(); }
overlay.addEventListener('click',play);
btnPlay.addEventListener('click',()=>playing?pause():play());
scrub.addEventListener('input',()=>{ pause(); overlay.style.display='none'; cur=+scrub.value; render(g0,cur,K); });
window.addEventListener('resize',fit);

// ============================================================
//  Exportar MP4 (cuadro a cuadro, sin depender del tiempo real)
// ============================================================
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
async function exportMP4(){
  pause(); btnExport.disabled=true;
  const S=1080, off=document.createElement('canvas'); off.width=off.height=S; const g=off.getContext('2d');
  try{
    if(!('VideoEncoder' in window)) return await recordRealtime(off,g);
    statusEl.textContent='preparando…';
    await loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js');
    const {Muxer, ArrayBufferTarget}=window.Mp4Muxer;
    let codec=null;
    for(const c of ['avc1.640028','avc1.4d0028','avc1.42e028']){
      const s=await VideoEncoder.isConfigSupported({codec:c,width:S,height:S,bitrate:12e6,framerate:FPS});
      if(s.supported){ codec=c; break; }
    }
    if(!codec) return await recordRealtime(off,g);
    const muxer=new Muxer({target:new ArrayBufferTarget(), video:{codec:'avc',width:S,height:S,frameRate:FPS}, fastStart:'in-memory'});
    let err=null;
    const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta), error:e=>{err=e;}});
    enc.configure({codec,width:S,height:S,bitrate:12e6,framerate:FPS});
    const N=Math.round(DUR*FPS);
    for(let i=0;i<N;i++){
      if(err) throw err;
      render(g,i/FPS,1);
      const f=new VideoFrame(off,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      enc.encode(f,{keyFrame:i%(FPS*2)===0}); f.close();
      if(i%10===0){ statusEl.textContent=`creando video… ${Math.round(i/N*100)}%`; await new Promise(r=>setTimeout(r,0)); }
      while(enc.encodeQueueSize>8) await new Promise(r=>setTimeout(r,5));
    }
    await enc.flush(); muxer.finalize();
    download(new Blob([muxer.target.buffer],{type:'video/mp4'}),'feliz-cumpleanos-osita.mp4');
    statusEl.textContent='¡listo! el video se descargó ♡';
  }catch(e){ console.error(e); statusEl.textContent='no se pudo crear el video: '+e.message; }
  finally{ btnExport.disabled=false; }
}
// Plan B (navegadores sin WebCodecs): graba en tiempo real
async function recordRealtime(off,g){
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mime) throw new Error('este navegador no puede grabar video');
  const rec=new MediaRecorder(off.captureStream(FPS),{mimeType:mime,videoBitsPerSecond:10e6}), chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  rec.start();
  const t0=performance.now();
  await new Promise(res=>{ (function f(){ const t=(performance.now()-t0)/1000; render(g,Math.min(t,DUR),1);
    statusEl.textContent=`grabando… ${Math.round(Math.min(t/DUR,1)*100)}%`; t<DUR?requestAnimationFrame(f):res(); })(); });
  rec.stop(); await done;
  download(new Blob(chunks,{type:mime}),'feliz-cumpleanos-osita.'+(mime.includes('mp4')?'mp4':'webm'));
  statusEl.textContent='¡listo! el video se descargó ♡';
}
btnExport.addEventListener('click',exportMP4);

(async()=>{
  try{ await document.fonts.load('700 64px Caveat'); await document.fonts.load('500 64px Caveat'); }catch(e){}
  const q=new URLSearchParams(location.search);
  if(q.has('t')){ cur=+q.get('t'); overlay.style.display='none'; scrub.value=cur; }
  fit();
})();
